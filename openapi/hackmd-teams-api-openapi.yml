openapi: 3.2.0
info:
  title: HackMD Open Teams API
  version: 1.0.0
  description: HackMD OpenAPI
  license:
    name: UNLICENSED
  contact:
    name: HackMD Team
    email: support@hackmd.io
servers:
- url: /v1
  description: API Server
tags:
- name: Teams
  description: Operations related to user teams.
paths:
  /teams:
    get:
      operationId: ListTeams
      responses:
        '200':
          description: Ok
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/Team'
                type: array
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiRequestErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '429':
          description: Rate limit or workspace quota exceeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiRateLimitErrorResponse'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiServerErrorResponse'
      description: List the teams for the current user
      tags:
      - Teams
      security:
      - token: []
      parameters: []
      summary: List teams
      x-summary-source: derived
components:
  schemas:
    ApiErrorResponse:
      properties:
        error:
          type: string
      required:
      - error
      type: object
      additionalProperties: false
    TeamVisibilityType:
      enum:
      - public
      - private
      type: string
    ApiRequestErrorResponse:
      properties:
        message:
          type: string
      required:
      - message
      type: object
      additionalProperties: false
    ApiRateLimitErrorResponse:
      anyOf:
      - $ref: '#/components/schemas/ApiErrorResponse'
      - $ref: '#/components/schemas/ApiQuotaErrorResponse'
    ApiQuotaErrorResponse:
      properties:
        error:
          properties:
            upgradeUrl:
              type: string
            helpUrl:
              type: string
            message:
              type: string
            code:
              type: string
              enum:
              - quota_exceeded
          required:
          - upgradeUrl
          - helpUrl
          - message
          - code
          type: object
      required:
      - error
      type: object
      additionalProperties: false
    ApiServerErrorResponse:
      anyOf:
      - $ref: '#/components/schemas/ApiErrorResponse'
      - $ref: '#/components/schemas/ApiRequestErrorResponse'
    Team:
      properties:
        id:
          type: string
        ownerId:
          type:
          - string
          - 'null'
        name:
          type: string
        logo:
          type: string
        path:
          type: string
        description:
          type:
          - string
          - 'null'
        visibility:
          $ref: '#/components/schemas/TeamVisibilityType'
        upgraded:
          type: boolean
        createdAt:
          type: number
          format: double
      required:
      - id
      - ownerId
      - name
      - logo
      - path
      - description
      - visibility
      - upgraded
      - createdAt
      type: object
      additionalProperties: false
  securitySchemes:
    token:
      type: http
      scheme: bearer
x-provenance:
  method: harvested
  publisher: HackMD
  source: https://api.hackmd.io/v1/docs/swagger.json
  note: split by refine-openapis from the provider's own published document, verified by fetch (openapi/_original/*.fetch.json);
    stamped by stamp-openapi-provenance.py (roadmap#793)
