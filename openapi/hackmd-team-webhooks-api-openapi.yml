            code:
              type: string
          required:
          - message
          - code
          type: object
      required:
      - error
      type: object
    ApiRequestErrorResponse:
      properties:
        message:
          type: string
      required:
      - message
      type: object
      additionalProperties: false
    ApiWebhook:
