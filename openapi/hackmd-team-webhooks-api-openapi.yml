openapi: 3.2.0
info:
  title: HackMD Open Team Webhooks API
  version: 1.0.0
  description: HackMD OpenAPI
  license:
    name: UNLICENSED
  contact:
    name: HackMD Team
    email: support@hackmd.io
servers:
- url: /v1
  description: API Server
tags:
- name: Team Webhooks
  description: Operations for managing webhooks in a team workspace.
paths:
  /teams/{teampath}/webhooks:
    get:
      operationId: ListTeamWebhooks
      responses:
        '200':
          description: Ok
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/ApiWebhook'
                type: array
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiRequestErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '429':
          description: Rate limit or workspace quota exceeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiRateLimitErrorResponse'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiServerErrorResponse'
      description: List webhooks in a team workspace.
      tags:
      - Team Webhooks
      security:
      - token: []
      parameters:
      - in: path
        name: teampath
        required: true
        schema:
          type: string
      summary: List team webhooks
      x-summary-source: derived
    post:
      operationId: CreateTeamWebhook
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/ApiWebhook'
                - properties:
                    secret:
                      type: string
                  required:
                  - secret
                  type: object
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                anyOf:
                - $ref: '#/components/schemas/WebhookApiErrorResponse'
                - $ref: '#/components/schemas/ApiRequestErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '404':
          description: Folder not found
          content:
            application/json:
              schema:
                anyOf:
                - $ref: '#/components/schemas/WebhookApiErrorResponse'
                - $ref: '#/components/schemas/ApiErrorResponse'
        '422':
          description: Validation failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiValidationError'
        '429':
          description: Webhook limit reached
          content:
            application/json:
              schema:
                anyOf:
                - $ref: '#/components/schemas/WebhookApiErrorResponse'
                - $ref: '#/components/schemas/ApiRateLimitErrorResponse'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiServerErrorResponse'
      description: 'Create a webhook in a team workspace.

        The signing secret is returned only once and cannot be retrieved later.'
      tags:
      - Team Webhooks
      security:
      - token: []
      parameters:
      - in: path
        name: teampath
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateApiWebhookBody'
      summary: Create team webhook
      x-summary-source: derived
  /teams/{teampath}/webhooks/{hookId}:
    get:
      operationId: GetTeamWebhook
      responses:
        '200':
          description: Ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiWebhook'
        '400':
          description: Invalid webhook ID
          content:
            application/json:
              schema:
                anyOf:
                - $ref: '#/components/schemas/WebhookApiErrorResponse'
                - $ref: '#/components/schemas/ApiRequestErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '404':
          description: Webhook not found
          content:
            application/json:
              schema:
                anyOf:
                - $ref: '#/components/schemas/WebhookApiErrorResponse'
                - $ref: '#/components/schemas/ApiErrorResponse'
        '429':
          description: Rate limit or workspace quota exceeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiRateLimitErrorResponse'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiServerErrorResponse'
      description: Get a webhook in a team workspace.
      tags:
      - Team Webhooks
      security:
      - token: []
      parameters:
      - in: path
        name: teampath
        required: true
        schema:
          type: string
      - in: path
        name: hookId
        required: true
        schema:
          type: string
      summary: Get team webhook
      x-summary-source: derived
    patch:
      operationId: UpdateTeamWebhook
      responses:
        '200':
          description: Ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiWebhook'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                anyOf:
                - $ref: '#/components/schemas/WebhookApiErrorResponse'
                - $ref: '#/components/schemas/ApiRequestErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '404':
          description: Webhook not found
          content:
            application/json:
              schema:
                anyOf:
                - $ref: '#/components/schemas/WebhookApiErrorResponse'
                - $ref: '#/components/schemas/ApiErrorResponse'
        '422':
          description: Validation failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiValidationError'
        '429':
          description: Rate limit or workspace quota exceeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiRateLimitErrorResponse'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiServerErrorResponse'
      description: 'Update a team webhook. At least one of name, url, or active is required.

        Scope and event selection cannot be changed.'
      tags:
      - Team Webhooks
      security:
      - token: []
      parameters:
      - in: path
        name: teampath
        required: true
        schema:
          type: string
      - in: path
        name: hookId
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateApiWebhookBody'
      summary: Update team webhook
      x-summary-source: derived
    delete:
      operationId: DeleteTeamWebhook
      responses:
        '204':
          description: No content
        '400':
          description: Invalid webhook ID
          content:
            application/json:
              schema:
                anyOf:
                - $ref: '#/components/schemas/WebhookApiErrorResponse'
                - $ref: '#/components/schemas/ApiRequestErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '404':
          description: Webhook not found
          content:
            application/json:
              schema:
                anyOf:
                - $ref: '#/components/schemas/WebhookApiErrorResponse'
                - $ref: '#/components/schemas/ApiErrorResponse'
        '429':
          description: Rate limit or workspace quota exceeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiRateLimitErrorResponse'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiServerErrorResponse'
      description: Delete a team webhook.
      tags:
      - Team Webhooks
      security:
      - token: []
      parameters:
      - in: path
        name: teampath
        required: true
        schema:
          type: string
      - in: path
        name: hookId
        required: true
        schema:
          type: string
      summary: Delete team webhook
      x-summary-source: derived
  /teams/{teampath}/webhooks/{hookId}/ping:
    post:
      operationId: PingTeamWebhook
      responses:
        '204':
          description: No content
        '400':
          description: Invalid webhook ID
          content:
            application/json:
              schema:
                anyOf:
                - $ref: '#/components/schemas/WebhookApiErrorResponse'
                - $ref: '#/components/schemas/ApiRequestErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '404':
          description: Webhook not found
          content:
            application/json:
              schema:
                anyOf:
                - $ref: '#/components/schemas/WebhookApiErrorResponse'
                - $ref: '#/components/schemas/ApiErrorResponse'
        '429':
          description: Too many ping requests
          content:
            application/json:
              schema:
                anyOf:
                - $ref: '#/components/schemas/WebhookApiErrorResponse'
                - $ref: '#/components/schemas/ApiRateLimitErrorResponse'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiServerErrorResponse'
      description: Send a test delivery for a team webhook.
      tags:
      - Team Webhooks
      security:
      - token: []
      parameters:
      - in: path
        name: teampath
        required: true
        schema:
          type: string
      - in: path
        name: hookId
        required: true
        schema:
          type: string
      summary: Ping team webhook
      x-summary-source: derived
  /teams/{teampath}/webhooks/{hookId}/deliveries:
    get:
      operationId: ListTeamWebhookDeliveries
      responses:
        '200':
          description: Ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedResponse_ApiWebhookDelivery_'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                anyOf:
                - $ref: '#/components/schemas/WebhookApiErrorResponse'
                - $ref: '#/components/schemas/ApiRequestErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '404':
          description: Webhook not found
          content:
            application/json:
              schema:
                anyOf:
                - $ref: '#/components/schemas/WebhookApiErrorResponse'
                - $ref: '#/components/schemas/ApiErrorResponse'
        '429':
          description: Rate limit or workspace quota exceeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiRateLimitErrorResponse'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiServerErrorResponse'
      description: List team webhook deliveries within the plan's retention window.
      tags:
      - Team Webhooks
      security:
      - token: []
      parameters:
      - in: path
        name: teampath
        required: true
        schema:
          type: string
      - in: path
        name: hookId
        required: true
        schema:
          type: string
      - in: query
        name: page
        required: false
        schema:
          $ref: '#/components/schemas/ApiWebhookPage'
      - in: query
        name: limit
        required: false
        schema:
          $ref: '#/components/schemas/ApiWebhookLimit'
      summary: List team webhook deliveries
      x-summary-source: derived
  /teams/{teampath}/webhooks/{hookId}/deliveries/export:
    get:
      operationId: ExportTeamWebhookDeliveries
      responses:
        '200':
          description: Ok
          content:
            application/x-ndjson:
              schema:
                type: string
        '400':
          description: Invalid webhook ID
          content:
            application/json:
              schema:
                anyOf:
                - $ref: '#/components/schemas/WebhookApiErrorResponse'
                - $ref: '#/components/schemas/ApiRequestErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '404':
          description: Webhook not found
          content:
            application/json:
              schema:
                anyOf:
                - $ref: '#/components/schemas/WebhookApiErrorResponse'
                - $ref: '#/components/schemas/ApiErrorResponse'
        '429':
          description: Rate limit or workspace quota exceeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiRateLimitErrorResponse'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiServerErrorResponse'
      description: Download team webhook deliveries as newline-delimited JSON.
      tags:
      - Team Webhooks
      security:
      - token: []
      parameters:
      - in: path
        name: teampath
        required: true
        schema:
          type: string
      - in: path
        name: hookId
        required: true
        schema:
          type: string
      summary: Export team webhook deliveries
      x-summary-source: derived
  /teams/{teampath}/webhooks/{hookId}/deliveries/{deliveryId}:
    get:
      operationId: GetTeamWebhookDelivery
      responses:
        '200':
          description: Ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiWebhookDelivery'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                anyOf:
                - $ref: '#/components/schemas/WebhookApiErrorResponse'
                - $ref: '#/components/schemas/ApiRequestErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '404':
          description: Delivery not found
          content:
            application/json:
              schema:
                anyOf:
                - $ref: '#/components/schemas/WebhookApiErrorResponse'
                - $ref: '#/components/schemas/ApiErrorResponse'
        '429':
          description: Rate limit or workspace quota exceeded
