      security:
      - token: []
      parameters:
      - in: path
        name: teampath
        required: true
        schema:
          type: string
      - in: path
        name: hookId
        required: true
        schema:
          type: string
      - in: path
        name: deliveryId
        required: true
        schema:
          type: string
      summary: Get team webhook delivery
      x-summary-source: derived
components:
  schemas:
    ApiValidationError:
      properties:
        message:
          type: string
          enum:
          - Validation Failed
        details:
          $ref: '#/components/schemas/Record_string.ApiValidationFieldError_'
      required:
      - message
      - details
      type: object
      additionalProperties: false
    UpdateApiWebhookBody:
