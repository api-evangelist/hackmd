aid: hackmd
name: HackMD
description: >-
  HackMD is a real-time collaborative Markdown editor and knowledge base for
  individuals and teams. Multiple people can co-edit a Markdown document live,
  organize notes into folders and team workspaces, and publish them as web pages,
  slide decks or books. HackMD exposes a v1 REST API at api.hackmd.io that lets
  developers programmatically create, read, update and delete personal and team
  notes, manage folders and folder ordering, upload image attachments, restore
  notes from trash, and read the current user profile and view history. The API
  authenticates with a personal access token sent as an HTTP bearer credential,
  is described by a published OpenAPI 3.0 specification and Swagger UI, ships an
  official Node.js/TypeScript client (@hackmd/api) and command-line interface,
  and advertises its full developer surface through an RFC 9727 api-catalog.
  HackMD is a Techstars-backed company.
